<style>
#quote-card-to-history {display:grid;justify-items:center;gap:.65em}
#quote-card-to-history .qc-viewport {width:min(100%,378px);border-radius:12px;overflow:hidden}
#quote-card-to-history .qc-canvas {display:block;width:100%;height:auto}
#quote-card-to-history .qc-controls {width:min(100%,378px)}
</style>
<script>
(() => {
  const root=document.getElementById("quote-card-to-history");
  const canvas=root.querySelector("canvas"), ctx=canvas.getContext("2d");
  const ref=root.querySelector("[data-photo]"), play=root.querySelector("[data-play]"), pos=root.querySelector("[data-position]");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const W=378,H=456,S=2;
  const clamp=v=>Math.max(0,Math.min(1,v));
  const mix=(a,b,k)=>a+(b-a)*k;
  const ease=v=>{v=clamp(v);return v*v*(3-2*v)};
  const phase=(v,a,b)=>ease((v-a)/(b-a));
  const font='-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif';
  let frame=0, ready=false, interacted=false;
  function box(x,y,w,h,r,fill,stroke,sw=1) {
    ctx.beginPath();ctx.roundRect(x,y,w,h,r);
    if(fill){ctx.fillStyle=fill;ctx.fill()}
    if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=sw;ctx.stroke()}
  }
  function text(s,x,y,size,weight,color,align="left"){
    ctx.fillStyle=color;ctx.font=weight+" "+size+"px "+font;ctx.textAlign=align;ctx.textBaseline="middle";
    ctx.fillText(s,x,y);
  }
  function layer(a,fn){if(a<=0)return;ctx.save();ctx.globalAlpha*=clamp(a);fn();ctx.restore()}
  function draw(t){
    if(!ready)return;
    const e=phase(t,0,.96), short=phase(t,.04,.81), row=phase(t,.18,.91);
    ctx.setTransform(S,0,0,S,0,0);ctx.clearRect(0,0,W,H);
    const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,"#f6f1df");bg.addColorStop(1,"#dde3db");
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    layer(phase(t,.08,.50),()=>{
      ctx.save();ctx.setLineDash([4,5]);box(15,18,345,169,18,"#ffffff40","#d4d7ce");ctx.restore();
      text("等待下一条估价",188,100,14,400,"#7d827a","center");
    });
    text("最近报价",10,221,13,650,"#20251f");
    const shift=74*row;
    for (const [sy,dy] of [[344,233],[419,308]]) {
      ctx.save();ctx.shadowColor="#26312222";ctx.shadowBlur=4;ctx.shadowOffsetY=1;
      box(9,dy+shift,353,69,8,"#fafbf9");ctx.restore();
      ctx.save();ctx.beginPath();ctx.roundRect(9,dy+shift,353,69,8);ctx.clip();
      ctx.drawImage(ref,9,sy,353,69,9,dy+shift,353,69);ctx.restore();
    }
    const x=mix(14,9,e), y=mix(18,233,e), w=mix(344,353,e), h=mix(171,69,short), r=mix(19,8,e);
    ctx.save();ctx.shadowColor="rgba(63,65,82,"+mix(.22,.13,e)+")";ctx.shadowBlur=mix(10,4,e);ctx.shadowOffsetY=mix(3,1,e);box(x,y,w,h,r,"#fff");ctx.restore();
    box(x,y,w,h,r,"#fff","#d0d3cd");
    layer(1-phase(t,.10,.76),()=>{
      const glow=ctx.createLinearGradient(x,y,x+w,y+h);
      glow.addColorStop(0,"#6496eb");glow.addColorStop(.29,"#90dcff");glow.addColorStop(.52,"#f3f1ff");glow.addColorStop(.80,"#9869d5");glow.addColorStop(1,"#553087");
      ctx.save();ctx.shadowColor="#8069b8";ctx.shadowBlur=5;box(x+2,y+2,w-4,h-4,r-1,null,glow,4);ctx.restore();
    });
    const titleX=mix(x+18,x+91,phase(t,.30,.93));
    const photoTravel=phase(t,.12,.80), photoSettle=phase(t,.65,.95);
    const px=mix(x+189,x+10,photoTravel), py=y+mix(34,4,photoTravel)+13*photoSettle;
    const pw=mix(124,68,short), ph=pw*67/124;
    ctx.drawImage(ref,203,160,124,67,px,py,pw,ph);
    const ownerY=y+mix(31,16,short), titleY=y+mix(61,36,short)+16*Math.sin(Math.PI*photoTravel);
    const badge=mix(20,15,short);
    box(titleX,ownerY-badge/2,badge,badge,6,"#e4e8d9");
    text("阿",titleX+badge/2,ownerY+.5,mix(10,9,short),500,"#58634a","center");
    text("阿杰",titleX+badge+6,ownerY,mix(13,10,short),500,"#535b50");
    text("威驰",titleX,titleY,mix(19,14,short),650,"#1b1c1e");
    layer(1-phase(t,.04,.35),()=>{
      text("1.5L 自动挡",x+18,y+85,15,600,"#202226");
      text("2017 年上牌 · 12 万公里",x+18,y+106,11,400,"#535855");
      box(x+18,y+120,w-36,1,0,"#dddddc");
      text("收车参考价",x+18,y+147,12,500,"#525652");
    });
    layer(phase(t,.68,.96),()=>{
      text("1.5L 自动挡",titleX+32,titleY,13,600,"#262827");
      text("12 万公里",titleX,y+h-14,10,400,"#72796f");
    });
    const priceY=y+mix(h-23,h/2,short);
    const priceColor="rgb("+Math.round(mix(25,69,short))+","+Math.round(mix(25,92,short))+","+Math.round(mix(29,51,short))+")";
    text("万",x+w-16,priceY+1,mix(14,12,short),500,priceColor,"right");
    text("4.20–4.80",x+w-mix(33,29,short),priceY,mix(23,15,short),650,priceColor,"right");
    pos.value=String(Math.round(t*1000));
    pos.setAttribute("aria-valuetext",Math.round(t*100)+"%");
  }
  function animate(hold=230) {
    cancelAnimationFrame(frame);draw(0);
    const start=performance.now()+hold;
    function tick(now){const t=clamp((now-start)/1450);draw(t);if(t<1)frame=requestAnimationFrame(tick)}
    frame=requestAnimationFrame(tick);
  }
  play.addEventListener("click",()=>{interacted=true;animate()});
  pos.addEventListener("input",()=>{interacted=true;cancelAnimationFrame(frame);draw(Number(pos.value)/1000)});
  function init(){
    if(ready||!ref.naturalWidth)return;
    ready=true;draw(0);
    if(reduce)return;
    if(!("IntersectionObserver" in window)){animate(700);return}
    const obs=new IntersectionObserver(items=>{
      if(items.some(i=>i.isIntersecting)){if(!interacted)animate(750);obs.disconnect()}
    },{threshold:.20});obs.observe(root);
  }
  ref.addEventListener("load",init);if(ref.complete)init();
})();
</script>
